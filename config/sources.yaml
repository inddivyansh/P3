# ==============================================================================
# Multi-Source Data Ingestion Framework — Configuration
# ==============================================================================
# Declarative specification for all raw intelligence data sources feeding into
# the AI-Powered Defence & Geopolitical Intelligence Platform (Stage 0).
#
# Supported Source Types:
#   - gdelt     : GDELT DOC 2.0 API (CSV / Geopolitical event stream)
#   - worldbank : World Bank Indicators API (REST / Macro military expenditure)
#   - sql       : Strategic Intelligence Reference Database (SQLite / Local relational)
#   - rss       : Defence RSS/Atom News Feeds (JSON / Feedparser)
#   - rest      : Generic REST API connector
#   - csv       : Generic CSV file / URL connector
#   - json      : Generic JSON file / endpoint connector
# ==============================================================================

version: "2.0"

# ------------------------------------------------------------------------------
# Global Storage & Error Policies
# ------------------------------------------------------------------------------
storage:
  raw_db_path: "data/p2_raw_store/unified_store.sqlite"
  dlq_path: "data/p2_dlq/dead_letter.json"
  batch_size: 100

error_policy:
  retry_max_attempts: 5
  retry_wait_min_seconds: 2
  retry_wait_max_seconds: 60
  retry_multiplier: 2

# ------------------------------------------------------------------------------
# Source Definitions
# ------------------------------------------------------------------------------
sources:
  # ----------------------------------------------------------------------------
  # Source 1: GDELT Geopolitical Event Stream (CSV)
  # Docs: https://blog.gdeltproject.org/gdelt-doc-2-0-api-debuts/
  # ----------------------------------------------------------------------------
  gdelt:
    enabled: true
    source_type: "gdelt"
    display_name: "GDELT Geopolitical Events"
    description: "Global Database of Events, Language & Tone covering open-source defence & geopolitical events"
    api_base: "https://api.gdeltproject.org/api/v2/doc/doc"
    max_records: 250
    language: "english"
    cache_path: "data/gdelt_events.csv"
    query_topics:
      - "Indian Army"
      - "Pakistan army"
      - "China PLA"
      - "LAC border India"
      - "Line of Control India"
      - "DRDO India"
      - "Doklam"
      - "Arunachal Pradesh China"
      - "Siachen glacier"
      - "Indian Navy"
      - "IAF India"
      - "defence procurement India"
      - "India China border"
      - "India Pakistan border"
      - "nuclear Pakistan India"
      - "terrorism India"

  # ----------------------------------------------------------------------------
  # Source 2: World Bank Military Expenditure API (REST)
  # Docs: https://datahelpdesk.worldbank.org/knowledgebase/topics/125589
  # ----------------------------------------------------------------------------
  worldbank:
    enabled: true
    source_type: "worldbank"
    display_name: "World Bank Military Expenditure"
    description: "Macroeconomic military spending trends (% of GDP & Current USD) for strategic nations"
    base_url: "https://api.worldbank.org/v2"
    indicator: "MS.MIL.XPND.GD.ZS" # Military expenditure (% of GDP)
    countries: "IN;CN;PK;NP;BD;LK;MM;AF;RU;US" # Strategic focus nations
    years: 15

  # ----------------------------------------------------------------------------
  # Source 3: Strategic Intelligence Reference Database (SQL)
  # Local SQLite database seeded with baseline country profiles & taxonomies
  # ----------------------------------------------------------------------------
  sql:
    enabled: true
    source_type: "sql"
    display_name: "Strategic Reference Database"
    description: "Local relational SQLite store containing geopolitical actor profiles and force postures"
    db_path: "data/intelligence_db.sqlite"
    table: "countries_of_interest"
    entity_type: "strategic_reference"
    entity_id_field: "id"
    batch_size: 500

  # ----------------------------------------------------------------------------
  # Source 4: Defence RSS / Atom News Feeds (JSON)
  # Extracted from RSS feeds listed below or referenced via config/feeds.yaml
  # ----------------------------------------------------------------------------
  rss:
    enabled: true
    source_type: "rss"
    display_name: "Defence RSS Ingestion Feeds"
    description: "Continuous RSS/Atom monitoring across accredited Indian and global defence outlets"
    feeds_config_file: "config/feeds.yaml"
    timeout_seconds: 15
    max_items_per_feed: 50
    feeds:
      - name: "idrw.org"
        url: "https://idrw.org/feed"
      - name: "nationaldefence.in"
        url: "https://nationaldefence.in/feed"
      - name: "broadsword"
        url: "https://ajaishukla.blogspot.com/feeds/posts/default"
      - name: "thehindu_national"
        url: "https://www.thehindu.com/news/national/feeder/default.rss"
      - name: "thewire"
        url: "https://thewire.in/rss"
      - name: "firstpost_defence"
        url: "https://www.firstpost.com/rss/defence.xml"
